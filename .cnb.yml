# CNB 云原生构建：从密钥仓库引入 GitHub SK，再拉 GitHub / CNB 数据刷新 SVG。

.generate: &generate
  docker:
    image: node:22
  imports:
    - https://cnb.cool/onmicrosoft/Github-SK/-/blob/main/main.yaml
  env:
    TZ: Asia/Shanghai
  stages:
    - name: generate-svgs
      script: |
        set -e
        export GITHUB_TOKEN="${SK:-$GITHUB_TOKEN}"
        node scripts/generate.mjs
        git config user.name "cnb-bot"
        git config user.email "cnb@cnb.cool"
        git add svg
        if git diff --staged --quiet; then
          echo "No SVG changes"
        else
          git commit -m "chore: refresh profile svgs"
          git push
        fi

cnb:
  push:
    - <<: *generate
      ifModify:
        - scripts/**
        - .cnb.yml
        - package.json
  "crontab: 0 4 * * *":
    - <<: *generate

main:
  push:
    - <<: *generate
      ifModify:
        - scripts/**
        - .cnb.yml
        - package.json
  "crontab: 0 4 * * *":
    - <<: *generate
