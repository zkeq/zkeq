    <rect width="932" height="132" fill="url(#veil)"/>
  </g>
  <path d="M269.5 37v58m385-58v58" fill="none" stroke="#c6cdd1"/>

  <text x="26" y="64" fill="#15191c" font-family="Georgia,'Times New Roman',serif" font-size="33" font-weight="600" letter-spacing="-1.4">Zkeq Projects</text>
  <text x="28" y="88" fill="#4c565e" font-family="'Noto Serif CJK SC','Songti SC',SimSun,serif" font-size="16">致力于提升每个人的生活体验</text>

