<svg xmlns="http://www.w3.org/2000/svg" width="932" height="132" viewBox="0 0 932 132" role="img" aria-labelledby="title desc">
  <title id="title">Zkeq Projects | RechoMemory | Synapse</title>
  <desc id="desc">Zkeq Projects，致力于提升每个人的生活体验。回想 RechoMemory，一个持续理解个人经历的 AI 记忆系统。Synapse，让思路在画布上显化。</desc>
  <defs>
