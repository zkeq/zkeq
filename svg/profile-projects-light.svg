      <stop offset="0" stop-color="#f8f9f9" stop-opacity="0"/>
      <stop offset=".28" stop-color="#f8f9f9" stop-opacity=".78"/>
      <stop offset=".72" stop-color="#f8f9f9" stop-opacity=".78"/>
      <stop offset="1" stop-color="#f8f9f9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="1" y="1" width="930" height="130" rx="13"/>
    </clipPath>
  </defs>

  <rect x=".5" y=".5" width="931" height="131" rx="14" fill="#f8f9f9" stroke="#d7dcdf"/>
